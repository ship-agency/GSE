<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 54" fill="none" aria-label="Summit Trading Logo">
  <rect width="310" height="54" rx="8" fill="#18222d" />
  <!-- Circular Globe/Mountain Icon -->
  <g transform="translate(12, 6)">
    <defs>
      <clipPath id="summit-circle-v3">
        <circle cx="21" cy="21" r="20" />
      </clipPath>
      <mask id="summit-mountain-mask-v3">
        <rect x="0" y="0" width="44" height="44" fill="#ffffff" />
        <polygon points="21,10 9,42 33,42" fill="#000000" />
      </mask>
    </defs>

    <g clip-path="url(#summit-circle-v3)">
      <g mask="url(#summit-mountain-mask-v3)">
        <rect x="0" y="3" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="7" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="11" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="15" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="19" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="23" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="27" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="31" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="35" width="44" height="2.4" fill="#FFFFFF" rx="1" />
        <rect x="0" y="39" width="44" height="2.4" fill="#FFFFFF" rx="1" />
      </g>
      <!-- Stylized compass peak inside the mountain opening -->
      <path d="M21 15 L17 35 L21 30 L25 35 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- SUMMIT TRADING Typography -->
  <text x="66" y="33" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" textLength="220" lengthAdjust="spacingAndGlyphs">SUMMIT TRADING</text>
</svg>
