<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <!-- GSE Monogram Graphic ("G" formed by logistics icons) -->
  <g transform="translate(10, 10)">
    <!-- Small star/beacon at top -->
    <path d="M142 8 L144 14 L150 14 L145 18 L147 24 L142 20 L137 24 L139 18 L134 14 L140 14 Z" fill="#5A8B88" />

    <!-- Airplane flying northeast -->
    <g transform="translate(100, 25) rotate(-28)">
      <path d="M22 0 L26 8 L42 20 L42 24 L26 21 L26 36 L32 41 L32 44 L23 42 L22 44 L21 42 L12 44 L12 41 L18 36 L18 21 L2 24 L2 20 L18 8 Z" fill="#E85D22" />
    </g>

    <!-- Cargo Vessel Top Left -->
    <g transform="translate(68, 80) rotate(-15)">
      <!-- Ship hull and bridge -->
      <path d="M4 14 L28 14 L34 2 L26 2 L26 6 L12 6 L12 10 L4 10 Z" fill="#5A8B88" />
      <path d="M2 14 L30 14 L24 24 L8 24 Z" fill="#5A8B88" />
    </g>

    <!-- Forklift -->
    <g transform="translate(50, 122) rotate(-8)">
      <!-- Cab and wheel -->
      <path d="M6 14 L18 14 L22 6 L14 6 Z" fill="#E85D22" />
      <path d="M22 2 L24 2 L24 20 L28 20 L28 22 L22 22 Z" fill="#E85D22" />
      <circle cx="9" cy="20" r="3" fill="#E85D22" />
      <circle cx="19" cy="20" r="3" fill="#E85D22" />
    </g>

    <!-- Large Ship Hull/Container Carrier Profile -->
    <g transform="translate(42, 168)">
      <path d="M6 2 L20 2 L20 8 L32 8 L30 20 L4 20 L2 8 L6 8 Z" fill="#5A8B88" />
      <path d="M4 20 L28 20 L22 36 L10 36 Z" fill="#5A8B88" />
    </g>

    <!-- Anchor/Spreader -->
    <g transform="translate(40, 218) rotate(15)">
      <path d="M4 10 L16 2 L28 10 L24 14 L16 8 L8 14 Z" fill="#E85D22" />
      <rect x="13" y="10" width="6" height="12" fill="#E85D22" />
      <rect x="8" y="22" width="16" height="4" rx="2" fill="#E85D22" />
    </g>

    <!-- Hull Stern with "22" -->
    <g transform="translate(76, 260) rotate(25)">
      <path d="M0 4 L28 0 L24 16 L2 16 Z" fill="#5A8B88" />
      <text x="10" y="12" fill="#FFFFFF" font-size="6" font-family="sans-serif" font-weight="bold">22</text>
    </g>

    <!-- Logistics worker with helmet -->
    <g transform="translate(118, 255)">
      <ellipse cx="10" cy="5" rx="5" ry="3" fill="#E85D22" />
      <circle cx="10" cy="9" r="3.5" fill="#E85D22" />
      <path d="M3 16 C3 13 6 12 10 12 C14 12 17 13 17 16 L17 22 L3 22 Z" fill="#E85D22" />
      <rect x="7" y="16" width="6" height="5" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Map pin/Geo marker -->
    <g transform="translate(138, 242)">
      <path d="M12 2 C6.5 2 2 6.5 2 12 C2 18 12 28 12 28 C12 28 22 18 22 12 C22 6.5 17.5 2 12 2 Z M12 16 C9.8 16 8 14.2 8 12 C8 9.8 9.8 8 12 8 C14.2 8 16 9.8 16 12 C16 14.2 14.2 16 12 16 Z" fill="#5A8B88" />
    </g>

    <!-- Small orange pin -->
    <g transform="translate(164, 254)">
      <path d="M5 1 C3 1 1 3 1 5 C1 8 5 13 5 13 C5 13 9 8 9 5 C9 3 7 1 5 1 Z" fill="#E85D22" />
    </g>

    <!-- Hand care symbol -->
    <g transform="translate(166, 206)">
      <path d="M4 26 L10 26 L10 8 C10 6 12 4 14 4 C16 4 18 6 18 8 L18 18 L20 18 C22 18 24 16 24 14 L24 22 C24 28 18 32 10 32 L4 32 Z" fill="#E85D22" />
    </g>

    <!-- Document/Manifest -->
    <g transform="translate(142, 204)">
      <rect x="0" y="0" width="18" height="24" rx="2" fill="#5A8B88" />
      <line x1="3" y1="5" x2="15" y2="5" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="3" y1="10" x2="15" y2="10" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="3" y1="15" x2="11" y2="15" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- Cargo truck/Container trailer -->
    <g transform="translate(148, 168)">
      <rect x="0" y="4" width="24" height="14" rx="1" fill="#E85D22" />
      <path d="M24 10 L30 10 L34 14 L34 18 L24 18 Z" fill="#E85D22" />
      <circle cx="6" cy="20" r="2.5" fill="#E85D22" />
      <circle cx="18" cy="20" r="2.5" fill="#E85D22" />
      <circle cx="28" cy="20" r="2.5" fill="#E85D22" />
    </g>

    <!-- Pallets and boxes -->
    <g transform="translate(152, 142)">
      <rect x="0" y="2" width="12" height="10" fill="#5A8B88" />
      <rect x="14" y="6" width="10" height="6" fill="#5A8B88" />
      <rect x="26" y="4" width="8" height="8" fill="#5A8B88" />
      <rect x="0" y="14" width="34" height="2" fill="#5A8B88" />
    </g>

    <!-- Gantry Crane/Harbor Crane -->
    <g transform="translate(92, 166)">
      <!-- Jib -->
      <path d="M0 12 L38 2 L48 2 L48 5 L0 15 Z" fill="#5A8B88" />
      <!-- Legs and tower -->
      <path d="M28 4 L28 26 L24 26 L24 12 Z" fill="#5A8B88" />
      <path d="M34 4 L34 26 L38 26 L38 12 Z" fill="#5A8B88" />
      <!-- Suspended cargo box -->
      <line x1="14" y1="11" x2="14" y2="17" stroke="#5A8B88" stroke-width="1" />
      <rect x="10" y="17" width="8" height="6" fill="#5A8B88" />
    </g>
  </g>

  <!-- Typography: GSE CONNECTING ALL GOOD -->
  <!-- "GSE" Bold Text -->
  <text x="210" y="150" fill="currentColor" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="94" font-weight="900" letter-spacing="1">GSE</text>

  <!-- "CONNECTING ALL GOOD" Subtitle -->
  <text x="212" y="186" fill="#94A3B8" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="16.5" font-style="italic" font-weight="600" letter-spacing="3.2">CONNECTING ALL GOOD</text>
</svg>
